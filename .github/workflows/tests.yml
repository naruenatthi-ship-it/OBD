name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # the 4.0.0 package on PyPI has mismatched version metadata that new
      # pip versions reject, so install the same release from its git tag
      - run: pip install pyserial pytest "ELM327-emulator @ git+https://github.com/Ircama/ELM327-emulator@v4.0.0"
      - run: python -m pytest -q
